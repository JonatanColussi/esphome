name: Tanquinho

on:
  push:
    branches: [main]
    paths:
      - "projects/tanquinho/**"
      - ".github/workflows/tanquinho.yml"
  pull_request:
    paths:
      - "projects/tanquinho/**"
      - ".github/workflows/tanquinho.yml"

permissions:
  contents: read

concurrency:
  group: tanquinho-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.4.1"

jobs:
  tela:
    name: Testes da tela
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lógica da tela
        run: node projects/tanquinho/test/ui-logic.test.js

  firmware:
    name: Firmware (config e compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/tanquinho
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tanquinho.yml
      - name: Instalar ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"
      # Segredos de mentira, gerados a cada execução: nenhuma senha real vai para o GitHub.
      - name: Segredos de teste
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci"
          wifi_password: "$(openssl rand -hex 8)"
          api_key: "$(openssl rand -base64 32)"
          ota_password: "$(openssl rand -hex 16)"
          ap_password: "$(openssl rand -hex 8)"
          EOF
      - name: Validar configuração
        run: esphome config tanquinho.yaml > /dev/null
      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            projects/tanquinho/.esphome/platformio
          key: pio-${{ runner.os }}-${{ env.ESPHOME_VERSION }}
      - name: Compilar
        run: esphome compile tanquinho.yaml
