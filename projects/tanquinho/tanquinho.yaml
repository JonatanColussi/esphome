esphome:
  name: tanquinho
  friendly_name: Tanquinho
  on_boot:
    priority: -100
    then:
      # A reboot in the middle of a wash counts as an interrupted wash.
      - lambda: |-
          if (id(h_running)) {
            id(h_interrupted) += 1;
            id(h_interrupted_stage) = id(h_stage);
            id(h_interrupted_cycle) = id(h_cycle);
            id(h_running) = false;
          }
      - script.execute: state_off

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  # No Home Assistant here: never reboot for lack of API clients.
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  reboot_timeout: 0s
  # Keep the radio awake between packets: much lower latency on a weak signal.
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Tanquinho Fallback"
    password: !secret ap_password

captive_portal:

# Diagnostics shown in the Advanced UI: last reset reason and Wi-Fi signal.
debug:
  update_interval: 60s

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

web_server:
  # Phone UI built from src/ by `npm run build:ui`; served as /0.js.
  js_include: dist/ui.js
  js_url: ""
  # No firmware upload from the browser (/update has no password); only password-protected OTA.
  ota: false

preferences:
  flash_write_interval: 10s

globals:
  # Wash history: survives reboots (shown in the Advanced UI).
  - id: h_started
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_completed
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_stopped
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_interrupted
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_running
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Current stage: 1 Filling, 2 Mixing, 3 Soaking, 4 Washing, 5 Draining.
  - id: h_stage
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_cycle
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_interrupted_stage
    type: int
    restore_value: yes
    initial_value: '0'
  - id: h_interrupted_cycle
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cycle_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: start_time
    type: int
    restore_value: no
    initial_value: '0'
  - id: total_time
    type: int
    restore_value: no
    initial_value: '0'
  - id: fill_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: mix_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: soak_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: wash_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: drain_ms
    type: int
    restore_value: no
    initial_value: '0'
  - id: current_cycle
    type: int
    restore_value: no
    initial_value: '0'
  - id: total_cycles
    type: int
    restore_value: no
    initial_value: '0'

select:
  - platform: template
    name: "Water Level"
    id: water_level
    icon: mdi:waves-arrow-up
    options:
      - "Low"
      - "Medium"
      - "High"
    initial_option: "Medium"
    optimistic: true
    restore_value: true

number:
  # Fill times stop at 10 min, the same limit as water_valve_limit.
  - platform: template
    optimistic: true
    name: "Fill Low (min)"
    id: fill_low
    min_value: 0.5
    max_value: 10
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-plus
    entity_category: config
    initial_value: 2.5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Fill Medium (min)"
    id: fill_medium
    min_value: 0.5
    max_value: 10
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-plus
    entity_category: config
    initial_value: 3.5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Fill High (min)"
    id: fill_high
    min_value: 0.5
    max_value: 10
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-plus
    entity_category: config
    initial_value: 5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Drain Low (min)"
    id: drain_low
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-minus
    entity_category: config
    initial_value: 3
    restore_value: true

  - platform: template
    optimistic: true
    name: "Drain Medium (min)"
    id: drain_medium
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-minus
    entity_category: config
    initial_value: 4
    restore_value: true

  - platform: template
    optimistic: true
    name: "Drain High (min)"
    id: drain_high
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:water-minus
    entity_category: config
    initial_value: 5.5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Mix Time (min)"
    id: mix_time
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:rotate-right
    entity_category: config
    initial_value: 0.5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Soak Time (min)"
    id: soak_time
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:waves
    entity_category: config
    initial_value: 5
    restore_value: true

  - platform: template
    optimistic: true
    name: "Wash Time (min)"
    id: wash_time
    min_value: 0.5
    max_value: 30
    step: 0.5
    unit_of_measurement: "min"
    icon: mdi:rotate-3d
    entity_category: config
    initial_value: 15
    restore_value: true

  - platform: template
    optimistic: true
    name: "Cycles"
    id: cycle_count
    min_value: 1
    max_value: 5
    step: 1
    icon: mdi:rotate-3d-variant
    entity_category: config
    initial_value: 1
    restore_value: true

# Relay module is active-low. Interlocks: water and pump never together; motor and pump never together.
switch:
  - platform: gpio
    name: "Water Valve"
    pin:
      number: GPIO12
      inverted: true
    id: water_valve
    icon: mdi:water-plus
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - switch.turn_off: drain_pump
      - script.execute: water_valve_limit
    on_turn_off:
      - script.stop: water_valve_limit

  - platform: gpio
    name: "Motor"
    pin:
      number: GPIO27
      inverted: true
    id: motor
    icon: mdi:engine
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - switch.turn_off: drain_pump

  - platform: gpio
    name: "Drain Pump"
    pin:
      number: GPIO14
      inverted: true
    id: drain_pump
    icon: mdi:water-minus
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - switch.turn_off: water_valve
      - switch.turn_off: motor

  - platform: gpio
    name: "Auxiliary"
    pin:
      number: GPIO26
      inverted: true
    id: auxiliary
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: "Start Full Cycle"
    icon: mdi:play-circle
    on_press:
      - if:
          condition:
            lambda: 'return !id(cycle_active);'
          then:
            - script.execute: full_cycle

  - platform: template
    name: "Start Quick Cycle"
    icon: mdi:play-speed
    on_press:
      - if:
          condition:
            lambda: 'return !id(cycle_active);'
          then:
            - script.execute: quick_cycle

  - platform: template
    name: "Stop All"
    icon: mdi:stop-circle
    on_press:
      - lambda: |-
          if (id(cycle_active)) {
            id(h_stopped) += 1;
            id(h_running) = false;
          }
      - script.execute: state_off

binary_sensor:
  - platform: template
    name: "Running"
    id: running_sensor
    icon: mdi:washing-machine
    lambda: 'return id(cycle_active);'

text_sensor:
  - platform: template
    name: "Wash History"
    entity_category: diagnostic
    icon: mdi:history
    update_interval: 15s
    lambda: |-
      static const char *stage_names[] = {"start", "Filling", "Mixing", "Soaking", "Washing", "Draining"};
      std::string text = "Started " + std::to_string(id(h_started)) +
                         " | Completed " + std::to_string(id(h_completed)) +
                         " | Stopped " + std::to_string(id(h_stopped)) +
                         " | Interrupted " + std::to_string(id(h_interrupted));
      if (id(h_interrupted) > 0) {
        int stage = id(h_interrupted_stage);
        if (stage < 0 || stage > 5) stage = 0;
        text += " (last at " + std::string(stage_names[stage]) + ", cycle " +
                std::to_string(id(h_interrupted_cycle)) + ")";
      }
      return text;
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
  - platform: template
    name: "Stage"
    id: stage_sensor
    icon: mdi:information
    lambda: 'return {"Off"};'
    update_interval: never

  - platform: template
    name: "Time Remaining"
    id: time_remaining
    icon: mdi:timer
    lambda: 'return {"00:00:00"};'
    update_interval: never

  # "current/total" while a wash runs, empty otherwise.
  - platform: template
    name: "Cycle Progress"
    id: cycle_progress
    icon: mdi:counter
    lambda: 'return {""};'
    update_interval: never

script:
  # A water valve left on closes by itself after 10 min.
  - id: water_valve_limit
    mode: restart
    then:
      - delay: 10min
      - switch.turn_off: water_valve

  - id: state_off
    then:
      - script.stop: full_cycle
      - script.stop: quick_cycle
      - script.stop: run_cycles
      - switch.turn_off: water_valve
      - switch.turn_off: motor
      - switch.turn_off: drain_pump
      - switch.turn_off: auxiliary
      - globals.set:
          id: cycle_active
          value: 'false'
      - globals.set:
          id: start_time
          value: '0'
      - globals.set:
          id: total_time
          value: '0'
      - globals.set:
          id: current_cycle
          value: '0'
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Off"
      - text_sensor.template.publish:
          id: time_remaining
          state: "00:00:00"
      - text_sensor.template.publish:
          id: cycle_progress
          state: ""

  - id: state_filling
    then:
      - switch.turn_off: motor
      - switch.turn_off: drain_pump
      - switch.turn_on: water_valve
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Filling"
      - lambda: |-
          id(h_stage) = 1;
          id(h_cycle) = id(current_cycle);

  - id: state_mixing
    then:
      - switch.turn_off: water_valve
      - switch.turn_off: drain_pump
      - switch.turn_on: motor
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Mixing"
      - lambda: |-
          id(h_stage) = 2;
          id(h_cycle) = id(current_cycle);

  - id: state_soaking
    then:
      - switch.turn_off: water_valve
      - switch.turn_off: motor
      - switch.turn_off: drain_pump
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Soaking"
      - lambda: |-
          id(h_stage) = 3;
          id(h_cycle) = id(current_cycle);

  - id: state_washing
    then:
      - switch.turn_off: water_valve
      - switch.turn_off: drain_pump
      - switch.turn_on: motor
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Washing"
      - lambda: |-
          id(h_stage) = 4;
          id(h_cycle) = id(current_cycle);

  - id: state_draining
    then:
      - switch.turn_off: water_valve
      - switch.turn_off: motor
      - switch.turn_on: drain_pump
      - text_sensor.template.publish:
          id: stage_sensor
          state: "Draining"
      - lambda: |-
          id(h_stage) = 5;
          id(h_cycle) = id(current_cycle);

  # Freezes the active level's times for the wash about to start.
  - id: prepare_cycle
    parameters:
      quick: bool
    then:
      - lambda: |-
          auto index = id(water_level).active_index();
          size_t level = index.has_value() ? *index : 1;
          float fill_minutes[] = {id(fill_low).state, id(fill_medium).state, id(fill_high).state};
          float drain_minutes[] = {id(drain_low).state, id(drain_medium).state, id(drain_high).state};
          float factor = quick ? 0.5f : 1.0f;

          id(fill_ms) = (int) (fill_minutes[level] * 60000);
          id(drain_ms) = (int) (drain_minutes[level] * 60000);
          id(mix_ms) = (int) (id(mix_time).state * 60000 * factor);
          id(wash_ms) = (int) (id(wash_time).state * 60000 * factor);
          id(soak_ms) = quick ? 0 : (int) (id(soak_time).state * 60000);

          id(total_cycles) = (int) id(cycle_count).state;
          id(current_cycle) = 0;
          int cycle_ms = id(fill_ms) + id(mix_ms) + id(soak_ms) + id(wash_ms) + id(drain_ms);
          id(total_time) = (cycle_ms / 1000) * id(total_cycles);
          id(start_time) = millis();
          id(cycle_active) = true;
          id(h_started) += 1;
          id(h_running) = true;
          id(h_stage) = 0;
          id(h_cycle) = 0;

  - id: run_cycles
    then:
      - repeat:
          count: !lambda 'return id(total_cycles);'
          then:
            - lambda: |-
                id(current_cycle) += 1;
                id(cycle_progress).publish_state(
                  std::to_string(id(current_cycle)) + "/" + std::to_string(id(total_cycles)));
            - script.execute: state_filling
            - delay: !lambda 'return id(fill_ms);'
            - script.execute: state_mixing
            - delay: !lambda 'return id(mix_ms);'
            - if:
                condition:
                  lambda: 'return id(soak_ms) > 0;'
                then:
                  - script.execute: state_soaking
                  - delay: !lambda 'return id(soak_ms);'
            - script.execute: state_washing
            - delay: !lambda 'return id(wash_ms);'
            - script.execute: state_draining
            - delay: !lambda 'return id(drain_ms);'
      - lambda: |-
          id(h_completed) += 1;
          id(h_running) = false;
      - script.execute: state_off

  - id: full_cycle
    then:
      - script.execute:
          id: prepare_cycle
          quick: false
      - script.execute: run_cycles

  - id: quick_cycle
    then:
      - script.execute:
          id: prepare_cycle
          quick: true
      - script.execute: run_cycles

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(cycle_active)) {
            int elapsed = (millis() - id(start_time)) / 1000;
            int remaining = id(total_time) - elapsed;
            if (remaining < 0) remaining = 0;

            int hours = remaining / 3600;
            int minutes = (remaining % 3600) / 60;
            int seconds = remaining % 60;

            std::string text =
              std::to_string(hours) + ":" +
              (minutes < 10 ? "0" : "") + std::to_string(minutes) + ":" +
              (seconds < 10 ? "0" : "") + std::to_string(seconds);

            id(time_remaining).publish_state(text);
          }
